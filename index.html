<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gentleman Frame</title>
  <link rel="icon" href="data:,">
  <script src="https://unpkg.com/lucide@1.9.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <!-- i18n エンジン（app.js より先に読み込む必要あり） -->
  <script src="js/i18n.js"></script>
  <!-- 言語ファイルはアプリ内の「言語読込」ボタンから JSON で読み込めます -->
</head>
<body>

<!-- ===== ヘッダー ===== -->
<header>
  <div class="logo" style="cursor:pointer" onclick="window.scrollTo({top:0,behavior:'smooth'})">Gentleman Frame</div>
  <div class="header-controls">

    <div class="lang-popover-anchor">
      <button class="btn" id="langImportBtn" data-i18n-title="lang-import-title" title="言語を切り替える" style="min-width:0;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center"><i data-lucide="globe"></i></button>
      <div id="langImportDialog" class="lang-popover" hidden>
        <!-- 言語オプション一覧（JS で生成） -->
        <div id="langOptionList" class="lang-option-list"></div>
        <!-- 追加／インポートセクション（「+ 追加」選択時に表示） -->
        <div id="langAddSection" hidden>
          <hr class="lang-dialog-sep" style="margin:0">
          <div class="lang-add-form">
            <div id="langImportDrop" class="lang-import-drop">
              <i data-lucide="file-json" style="width:22px;height:22px;opacity:0.5;flex-shrink:0"></i>
              <div class="drop-text">
                <span data-i18n="lang-import-drop"></span>
                <span style="font-size:10px;" data-i18n="drop-hint"></span>
              </div>
            </div>
            <p class="lang-import-or" data-i18n="lang-import-or"></p>
            <textarea id="langImportText" class="lang-import-textarea" rows="4" data-i18n-ph="lang-import-ph"></textarea>
            <div class="lang-import-actions">
              <button class="btn primary" id="langImportApply" data-i18n="lang-import-apply"></button>
              <span style="flex:1"></span>
              <button class="btn" id="langTemplateDownload" data-i18n-title="lang-template-dl" title="テンプレートをDL" style="min-width:0;width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center"><i data-lucide="download"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button class="btn" id="themeBtn" style="min-width:0;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center"><i data-lucide="moon"></i></button>
    <a class="btn" href="https://github.com/E-DEN/gentleman-frame" target="_blank" rel="noopener" title="GitHub" style="min-width:0;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
  </div>
</header>

<!-- ===== アプリ本体 ===== -->
<div class="app-body">

  <!-- SVGフィルター定義 -->
  <svg id="svgFilters" style="display:none;position:absolute" xmlns="http://www.w3.org/2000/svg">
    <filter id="gblur" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feGaussianBlur id="svgGblur" edgeMode="duplicate" stdDeviation="0"/>
    </filter>
  </svg>
  <!-- ===== キャンバス ＋ トランスポート（オーバーレイ） ===== -->
  <div class="canvas-area">
    <div class="canvas-wrap" id="canvasWrap">
      <!-- 色調補正フィルターをここに適用（mainCanvas + rainOverlay が対象） -->
      <div id="effectsWrap" style="position:relative;z-index:1;line-height:0">
        <canvas id="mainCanvas" width="854" height="480"></canvas>
        <!-- 雨ガラスオーバーレイ（WebGL – effectsWrap 内で色調補正の対象） -->
        <canvas id="rainOverlay" width="854" height="480" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2"></canvas>
      </div>
      <!-- シネマバーオーバーレイ（effectsWrap 外側・雨オーバーレイの上に表示） -->
      <div id="barsOverlay" style="position:absolute;inset:0;pointer-events:none;z-index:3"></div>
      <!-- アンカーオーバーレイ（mix-blend-mode:difference で下レイヤーとネガポジ反転合成）-->
      <!-- z-index:4 = overlayCanvas(枠)より下 → 枠の色を巻き込まずに映像のみで反転 -->
      <canvas id="anchorCanvas" width="854" height="480" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;mix-blend-mode:difference"></canvas>
      <!-- 枠・ハンドルオーバーレイ（effectsWrap 外側 → CSS filter 非適用） -->
      <canvas id="overlayCanvas" width="854" height="480" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5"></canvas>
      <div id="canvasLoadOverlay" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,0.6);z-index:20;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:13px;border-radius:inherit;pointer-events:none">
        <div style="width:32px;height:32px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.75s linear infinite"></div>
        <span id="canvasLoadMsg"></span>
      </div>
      <!-- ドロップヒントオーバーレイ（Canvas描画の代替） -->
      <div id="canvasHintOverlay" style="position:absolute;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0">
        <span id="hintBg" class="canvas-hint"></span>
        <span id="hintFg" class="canvas-hint"></span>
      </div>
      <!-- 再生/一時停止フラッシュ表示 -->
      <div id="playFlash" style="position:absolute;inset:0;z-index:18;pointer-events:none;display:flex;align-items:center;justify-content:center">
        <div id="playFlashIcon"></div>
      </div>
      <!-- マスク D&D オーバーレイ：マスク領域に絶対配置し、実際のドロップターゲットとして機能 -->
      <div id="maskDropOverlay"></div>
      <!-- 動画全非表示オーバーレイ -->
      <div id="vidHiddenOverlay" style="display:none;position:absolute;inset:0;z-index:15;align-items:center;justify-content:center;pointer-events:none">
        <i data-lucide="eye-off" style="width:48px;height:48px;opacity:0.25;color:#fff"></i>
      </div>
      <!-- トランスポートオーバーレイ -->
      <div class="transport">
        <div class="transport-row">
          <button class="tbtn" id="playBtn" data-i18n-title="play-title" title="再生/一時停止"><i data-lucide="play"></i></button>
          <button class="tbtn" id="stopBtn" data-i18n-title="stop-title" title="停止"><i data-lucide="square"></i></button>
          <div class="transport-vol">
            <div class="transport-vol-popup">
              <div class="vol-track-wrap">
                <div class="vol-track" id="masterVolTrack">
                  <div class="vol-fill" id="masterVolFill"></div>
                  <div class="vol-thumb" id="masterVolThumb"></div>
                </div>
              </div>
            </div>
            <button class="tbtn transport-mute-btn" id="masterMuteBtn" data-i18n-title="mute-title" title="ミュート"><i data-lucide="volume-2"></i></button>
          </div>
          <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-thumb" id="progressThumb"></div>
          </div>
          <div class="time-label" id="timeLabel">0:00 / 0:00</div>
          <button class="tbtn" id="resyncBtn" data-i18n-title="resync" title="リシンク"><i data-lucide="refresh-cw"></i></button>
          <button class="tbtn" id="screenshotBtn" data-i18n-title="screenshot-title" title="スクリーンショット保存"><i data-lucide="camera"></i></button>
          <button class="tbtn" id="theaterBtn" title="シアターモード（パネル非表示）"><i data-lucide="panel-right-close"></i></button>
          <button class="tbtn" id="fullscreenBtn" title="フルスクリーン"><i data-lucide="maximize"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 右パネル ===== -->
  <div class="panel">

    <!-- 動画 -->
    <div class="card" data-card-id="vid">
      <div class="card-title"><span class="card-title-label"><span class="card-toggle"><i data-lucide="chevron-down"></i></span><i data-lucide="video"></i><span data-i18n="vid-title">動画</span></span><button class="preset-item-del icon-btn--vis" id="vidVisAllBtn" data-i18n-title="vid-vis-title" title="動画を表示/非表示" style="width:22px;height:22px;padding:0"><i data-lucide="eye"></i></button><button class="preset-item-del icon-btn--reset" id="vidResetAllBtn" data-i18n-title="vid-clear-title" title="動画をクリア" style="width:22px;height:22px;padding:0"><i data-lucide="rotate-ccw"></i></button></div>

      <!-- 背景（動画1） -->
      <div class="vid-section">
        <div class="vid-section-header">
          <span data-i18n="bg-title">背景</span>
          <div class="vid-section-btns">
            <button class="preset-item-del icon-btn--vis" id="visBtn0" data-i18n-title="bg-vis-title" title="背景を表示/非表示" style="width:22px;height:22px;padding:0"><i data-lucide="eye"></i></button>
            <button class="preset-item-del icon-btn--reset" id="resetBtn0" data-i18n-title="bg-clear-title" title="背景をクリア" style="width:22px;height:22px;padding:0"><i data-lucide="rotate-ccw"></i></button>
          </div>
        </div>
        <div class="drop-zone" id="drop0" role="button" tabindex="0">
        <div class="drop-loading-overlay" style="display:none"></div>
          <button class="drop-delete" id="del0" data-i18n-title="del-title" title="削除"><i data-lucide="x"></i></button>
          <a class="drop-link" id="dropLink0" data-i18n-title="open-page-title" target="_blank" rel="noopener" title="元ページを開く" tabindex="-1"><i data-lucide="external-link"></i></a>
          <div class="drop-icon"><i data-lucide="upload"></i></div>
          <div class="drop-text">
            <div class="drop-label0" data-i18n="drop-label">MP4をここにドロップ</div>
            <div class="drop-hint" style="font-size:10px;" data-i18n="drop-hint">またはクリックして選択</div>
          </div>
          <input type="file" id="file0" accept="video/*,image/*" style="display:none">
        </div>
        <div id="videoControls0">
        <div class="url-row">
          <label for="urlInput0" class="url-label">URL</label>
          <input type="text" class="url-input" id="urlInput0" placeholder="https://www.iwara.tv/video/..." autocomplete="off" spellcheck="false">
          <button class="url-load-btn" id="urlLoadBtn0" data-i18n="load-btn">読込</button>
        </div>
        <div id="urlErr0" class="url-err"></div>
        <div class="ctrl-row">
          <label><span data-i18n="vol">音量</span><button class="mute-btn" id="mute0" data-i18n-title="mute-title" title="ミュート"><i data-lucide="volume-2"></i></button></label>
          <input type="range" id="vol0" min="0" max="100" value="25">
          <input type="text" class="ctrl-val" id="vol0Val" value="25" spellcheck="false" autocomplete="off">
        </div>
        <div class="ctrl-row">
          <label data-i18n="offset">オフセット</label>
          <input type="range" id="offset0" min="-10" max="10" value="0" step="0.01">
          <input type="text" class="ctrl-val" id="offset0Val" value="+0.00" spellcheck="false" autocomplete="off">
        </div>
        <div class="offset-btns">
          <button class="offset-btn" data-id="offset0" data-d="-0.1">-0.1</button>
          <button class="offset-btn" data-id="offset0" data-d="-0.01">-0.01</button>
          <button class="offset-btn" data-id="offset0" data-d="0">0</button>
          <button class="offset-btn" data-id="offset0" data-d="+0.01">+0.01</button>
          <button class="offset-btn" data-id="offset0" data-d="+0.1">+0.1</button>
        </div>
        </div>
      </div>

      <!-- 入れ替えセパレーター -->
      <div class="vid-swap-sep">
        <button class="vid-swap-btn" id="swapBtn" data-i18n-title="swap-title" title="背景・前景入れ替え"><i data-lucide="arrow-up-down"></i></button>
      </div>

      <!-- 前景（動画2） -->
      <div class="vid-section">
        <div class="vid-section-header">
          <span data-i18n="fg-title">前景</span>
          <div class="vid-section-btns">
            <button class="preset-item-del icon-btn--vis" id="visBtn1" data-i18n-title="fg-vis-title" title="前景を表示/非表示" style="width:22px;height:22px;padding:0"><i data-lucide="eye"></i></button>
            <button class="preset-item-del icon-btn--reset" id="resetBtn1" data-i18n-title="fg-clear-title" title="前景をクリア" style="width:22px;height:22px;padding:0"><i data-lucide="rotate-ccw"></i></button>
          </div>
        </div>
        <div class="drop-zone" id="drop1" role="button" tabindex="0">
        <div class="drop-loading-overlay" style="display:none"></div>
          <button class="drop-delete" id="del1" data-i18n-title="del-title" title="削除"><i data-lucide="x"></i></button>
          <a class="drop-link" id="dropLink1" data-i18n-title="open-page-title" target="_blank" rel="noopener" title="元ページを開く" tabindex="-1"><i data-lucide="external-link"></i></a>
          <div class="drop-icon"><i data-lucide="upload"></i></div>
          <div class="drop-text">
            <div class="drop-label1" data-i18n="drop-label">MP4をここにドロップ</div>
            <div class="drop-hint" style="font-size:10px;" data-i18n="drop-hint">またはクリックして選択</div>
          </div>
          <input type="file" id="file1" accept="video/*,image/*" style="display:none">
        </div>
        <div id="videoControls1">
        <div class="url-row">
          <label for="urlInput1" class="url-label">URL</label>
          <input type="text" class="url-input" id="urlInput1" placeholder="https://www.iwara.tv/video/..." autocomplete="off" spellcheck="false">
          <button class="url-load-btn" id="urlLoadBtn1" data-i18n="load-btn">読込</button>
        </div>
        <div id="urlErr1" class="url-err"></div>
        <div class="ctrl-row">
          <label><span data-i18n="vol">音量</span><button class="mute-btn" id="mute1" data-i18n-title="mute-title" title="ミュート"><i data-lucide="volume-2"></i></button></label>
          <input type="range" id="vol1" min="0" max="100" value="25">
          <input type="text" class="ctrl-val" id="vol1Val" value="25" spellcheck="false" autocomplete="off">
        </div>
        <div class="ctrl-row">
          <label data-i18n="offset">オフセット</label>
          <input type="range" id="offset1" min="-10" max="10" value="0" step="0.01">
          <input type="text" class="ctrl-val" id="offset1Val" value="+0.00" spellcheck="false" autocomplete="off">
        </div>
        <div class="offset-btns">
          <button class="offset-btn" data-id="offset1" data-d="-0.1">-0.1</button>
          <button class="offset-btn" data-id="offset1" data-d="-0.01">-0.01</button>
          <button class="offset-btn" data-id="offset1" data-d="0">0</button>
          <button class="offset-btn" data-id="offset1" data-d="+0.01">+0.01</button>
          <button class="offset-btn" data-id="offset1" data-d="+0.1">+0.1</button>
        </div>
        </div>
      </div>
    </div>

    <div class="panel-sep"></div>

    <!-- マスク -->
    <div class="card" data-card-id="mask">
      <div class="card-title"><span class="card-title-label"><span class="card-toggle"><i data-lucide="chevron-down"></i></span><i data-lucide="crop"></i><span data-i18n="mask-title">マスク</span></span><button class="preset-item-del icon-btn--vis" id="maskVisBtn" data-i18n-title="mask-vis-title" title="マスクを表示/非表示" style="width:22px;height:22px;padding:0"><i data-lucide="eye"></i></button><button class="preset-item-del icon-btn--reset" id="maskResetBtn" data-i18n-title="mask-reset-title" title="マスクをリセット" style="width:22px;height:22px;padding:0"><i data-lucide="rotate-ccw"></i></button></div>
      <div class="ctrl-row">
        <label data-i18n="shape">形状</label>
        <div class="shape-group">
          <button class="shape-btn active" data-shape="rect" data-i18n-title="shape-rect" title="四角"><i data-lucide="square"></i></button>
          <button class="shape-btn" data-shape="circle" data-i18n-title="shape-circle" title="円"><i data-lucide="circle"></i></button>
          <button class="shape-btn" data-shape="heart" data-i18n-title="shape-heart" title="ハート"><i data-lucide="heart"></i></button>
          <button class="shape-btn" data-shape="phone" data-i18n-title="shape-phone" title="スマホ"><i data-lucide="smartphone"></i></button>
          <button class="shape-btn" data-shape="glasses" data-i18n-title="shape-glasses" title="メガネ"><i data-lucide="glasses"></i></button>
        </div>
      </div>
      <div class="ctrl-row" id="glassesUiRow" style="display:none">
        <label data-i18n="glasses-style">スタイル</label>
        <div class="glasses-ui-group">
          <button class="glasses-ui-btn active" data-gstyle="0" title="ラウンド">
            <svg viewBox="0 0 2309 920" width="28" height="12" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(4.166667,0,0,4.166667,1735.157,80.322)"><path d="M0,182.146C-50.218,182.146 -91.073,141.291 -91.073,91.073C-91.073,40.855 -50.218,0 0,0C50.218,0 91.073,40.855 91.073,91.073C91.073,141.291 50.218,182.146 0,182.146Z M-278.823,182.146C-329.041,182.146 -369.896,141.291 -369.896,91.073C-369.896,40.855 -329.041,0 -278.823,0C-228.605,0 -187.75,40.855 -187.75,91.073C-187.75,141.291 -228.605,182.146 -278.823,182.146Z M129.103,51.679L101.708,51.679C85.878,10.949 46.258,-18 0,-18C-45.314,-18 -84.258,9.779 -100.709,49.199C-111.771,40.321 -125.128,35.624 -139.412,35.624C-153.695,35.624 -167.052,40.321 -178.114,49.198C-194.566,9.778 -233.51,-18 -278.823,-18C-325.082,-18 -364.702,10.949 -380.532,51.679L-407.926,51.679C-411.902,51.679 -415.137,54.914 -415.137,58.89C-415.137,62.866 -411.902,66.101 -407.926,66.101L-385.008,66.101C-386.894,74.123 -387.896,82.483 -387.896,91.073C-387.896,151.216 -338.966,200.146 -278.823,200.146C-218.68,200.146 -169.75,151.216 -169.75,91.073C-169.75,81.763 -170.925,72.722 -173.131,64.088L-171.963,62.992C-153.71,45.845 -125.113,45.845 -106.86,62.992L-105.692,64.089C-107.898,72.722 -109.073,81.763 -109.073,91.073C-109.073,151.216 -60.143,200.146 0,200.146C60.143,200.146 109.073,151.216 109.073,91.073C109.073,82.483 108.071,74.123 106.184,66.101L129.103,66.101C133.079,66.101 136.314,62.866 136.314,58.89C136.314,54.914 133.079,51.679 129.103,51.679Z" fill="none" stroke="currentColor" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/></g></svg>

        <div class="ctrl-row" id="borderAnimSpeedRow" style="display:none">
          <label data-i18n="border-speed">枠速度</label>
          <input type="range" id="borderAnimSpeed" min="0" max="10" value="1" step="0.1">
          <input type="text" class="ctrl-val" id="borderAnimSpeedVal" value="1.0" spellcheck="false" autocomplete="off">
        </div>
        <div class="ctrl-row" id="borderAnimBrightRow" style="display:none">
          <label data-i18n="border-bright">枠輝度</label>
          <input type="range" id="borderAnimBright" min="0" max="100" value="70" step="1">
          <input type="text" class="ctrl-val" id="borderAnimBrightVal" value="70" spellcheck="false" autocomplete="off">
        </div>
        <div class="ctrl-row" id="frameBlurRow" style="display:none">
          <label data-i18n="frame-blur">枠ぼかし</label>
          <input type="range" id="frameBlur" min="0" max="10" value="0" step="0.1">
          <input type="text" class="ctrl-val" id="frameBlurVal" value="0" spellcheck="false" autocomplete="off">
        </div>
        <div class="ctrl-row" id="frameTintRow" style="display:none">
          <label data-i18n="frame-tint">枠色合い</label>
          <input type="range" id="frameTint" min="-100" max="100" value="0" step="1">
          <input type="text" class="ctrl-val" id="frameTintVal" value="0" spellcheck="false" autocomplete="off">
        </div>
    </div>

    <div class="panel-sep"></div>

    <!-- カラーグレード / フィルター -->
    <div class="card" id="filterCard" data-card-id="filter">
      <div class="card-title"><span class="card-title-label"><span class="card-toggle"><i data-lucide="chevron-down"></i></span><i data-lucide="sparkles"></i><span data-i18n="filter-title">フィルター</span></span><button class="preset-item-del icon-btn--vis" id="filterVisBtn" data-i18n-title="filter-vis-title" title="フィルターを表示/非表示" style="width:22px;height:22px;padding:0"><i data-lucide="eye"></i></button><button class="preset-item-del icon-btn--reset" id="filterResetBtn" data-i18n-title="filter-reset-title" title="フィルターをリセット" style="width:22px;height:22px;padding:0"><i data-lucide="rotate-ccw"></i></button></div>
      <div id="filterQuickPresets" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">
        <button class="fqp-btn" data-fqp="cinema" data-i18n="fqp-cinema">シネマ</button>
        <button class="fqp-btn" data-fqp="retro" data-i18n="fqp-retro">レトロ</button>
        <button class="fqp-btn" data-fqp="insta" data-i18n="fqp-insta">インスタ</button>
        <button class="fqp-btn" data-fqp="pastel" data-i18n="fqp-pastel">パステル</button>
        <button class="fqp-btn" data-fqp="neon" data-i18n="fqp-neon">ネオン</button>
        <button class="fqp-btn" data-fqp="sunset" data-i18n="fqp-sunset">夕焼け</button>
        <button class="fqp-btn" data-fqp="cool" data-i18n="fqp-cool">クール</button>
        <button class="fqp-btn" data-fqp="dreamy" data-i18n="fqp-dreamy">ドリーミー</button>
        <button class="fqp-btn" data-fqp="glitch" data-i18n="fqp-glitch">グリッチ</button>
        <button class="fqp-btn" data-fqp="noir" data-i18n="fqp-noir">ノワール</button>
        <button class="fqp-btn" data-fqp="horror" data-i18n="fqp-horror">ホラー</button>
        <button class="fqp-btn" data-fqp="modern" data-i18n="fqp-modern">モダン</button>
        <button class="fqp-btn" data-fqp="trend" data-i18n="fqp-trend">トレンド</button>
        <span id="fqpSaveWrap" style="display:inline-flex;align-items:center;gap:4px;">
          <button id="fqpSaveBtn" class="fqp-btn fqp-save-btn" data-i18n-title="fqp-save-title" title="現在のフィルターを保存">+</button>
          <span id="fqpNameForm" style="display:none;align-items:center;gap:4px;">
            <input type="text" id="fqpNameInput" class="fqp-name-input" placeholder="name" maxlength="20" autocomplete="off">
            <button id="fqpNameOk" class="fqp-btn" style="padding:0;width:20px;height:20px;"><i data-lucide="check" style="width:12px;height:12px;"></i></button>
            <button id="fqpNameCancel" class="fqp-btn" style="padding:0;width:20px;height:20px;"><i data-lucide="x" style="width:12px;height:12px;"></i></button>
          </span>
        </span>
      </div>
      <div class="ctrl-mini-sep"></div>
      <!-- 露出・明るさ -->
      <div class="ctrl-row">
        <label data-i18n="brightness">明るさ</label>
        <input type="range" id="filterBrightness" min="0" max="200" value="100" step="1">
        <input type="text" class="ctrl-val" id="filterBrightnessVal" value="100" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="contrast">コントラスト</label>
        <input type="range" id="filterContrast" min="0" max="200" value="100" step="1">
        <input type="text" class="ctrl-val" id="filterContrastVal" value="100" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="filter-highlight">ハイライト</label>
        <input type="range" id="filterHighlight" min="-100" max="100" value="0" step="1">
        <input type="text" class="ctrl-val" id="filterHighlightVal" value="0" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="filter-shadow">シャドウ</label>
        <input type="range" id="filterShadow" min="-100" max="100" value="0" step="1">
        <input type="text" class="ctrl-val" id="filterShadowVal" value="0" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-mini-sep"></div>
      <!-- 色調整 -->
      <div class="ctrl-row">
        <label data-i18n="saturation">彩度</label>
        <input type="range" id="filterSaturation" min="0" max="200" value="100" step="1">
        <input type="text" class="ctrl-val" id="filterSaturationVal" value="100" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="filter-hue">色相</label>
        <input type="range" id="filterHue" min="-180" max="180" value="0" step="1">
        <input type="text" class="ctrl-val" id="filterHueVal" value="0" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="filter-temp">色温度</label>
        <input type="range" id="filterTemp" min="-50" max="50" value="0" step="1">
        <input type="text" class="ctrl-val" id="filterTempVal" value="0" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="filter-tint">色かぶり補正</label>
        <input type="range" id="filterTint" min="-50" max="50" value="0" step="1">
        <input type="text" class="ctrl-val" id="filterTintVal" value="0" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-mini-sep"></div>
      <!-- ルック・仕上げ -->
      <div class="ctrl-row">
        <label data-i18n="filter-sharpness">シャープネス</label>
        <input type="range" id="filterSharpness" min="0" max="10" value="0" step="0.1">
        <input type="text" class="ctrl-val" id="filterSharpnessVal" value="0" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="ca">色収差</label>
        <input type="range" id="filterCA" min="0" max="10" value="0" step="0.1">
        <input type="text" class="ctrl-val" id="filterCAVal" value="0" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="vignette">ビネット</label>
        <input type="range" id="filterVignette" min="0" max="10" value="0" step="0.1">
        <input type="text" class="ctrl-val" id="filterVignetteVal" value="0" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="filter-matte">マット</label>
        <input type="range" id="filterMatte" min="0" max="10" value="0" step="0.1">
        <input type="text" class="ctrl-val" id="filterMatteVal" value="0" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="filter-grain">フィルム粒子</label>
        <input type="range" id="filterGrain" min="0" max="10" value="0" step="0.1">
        <input type="text" class="ctrl-val" id="filterGrainVal" value="0" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="filter-blur">ぼかし</label>
        <input type="range" id="filterBlur" min="0" max="10" value="0" step="0.1">
        <input type="text" class="ctrl-val" id="filterBlurVal" value="0" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="filter-flare">カラーフレア</label>
        <input type="range" id="filterFlare" min="0" max="10" value="0" step="0.1">
        <input type="text" class="ctrl-val" id="filterFlareVal" value="0" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="filter-rain">雨</label>
        <input type="range" id="filterRain" min="0" max="10" value="0" step="1">
        <input type="text" class="ctrl-val" id="filterRainVal" value="0" spellcheck="false" autocomplete="off">
      </div>
      <!-- 雨サブパラメータ（filterRain > 0 のとき表示） -->
      <div class="ctrl-row" id="rainSpeedRow" style="display:none">
        <label data-i18n="rain-speed">雨 - 速度</label>
        <input type="range" id="rainSpeed" min="0.2" max="4" value="1" step="0.1">
        <input type="text" class="ctrl-val" id="rainSpeedVal" value="1.0" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row" id="rainRefractionRow" style="display:none">
        <label data-i18n="rain-refraction">雨 - 屈折</label>
        <input type="range" id="rainRefraction" min="20" max="600" value="200" step="10">
        <input type="text" class="ctrl-val" id="rainRefractionVal" value="200" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row" id="rainShadowRow" style="display:none">
        <label data-i18n="rain-shadow">雨 - 影</label>
        <input type="range" id="rainShadow" min="0" max="1" value="0" step="1">
        <input type="text" class="ctrl-val" id="rainShadowVal" value="OFF" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="filter-bars">レターボックス</label>
        <input type="range" id="filterBars" min="0" max="10" value="0" step="0.1">
        <input type="text" class="ctrl-val" id="filterBarsVal" value="0" spellcheck="false" autocomplete="off">
      </div>
      <div class="ctrl-row">
        <label data-i18n="filter-fps">フレームレート</label>
        <input type="range" id="filterFps" min="0" max="120" value="0" step="1">
        <input type="text" class="ctrl-val" id="filterFpsVal" value="0" spellcheck="false" autocomplete="off">
      </div>
    </div><!-- /filterCard -->

    <div class="panel-sep"></div>

    <!-- プリセット -->
    <div class="card" id="presetCard" data-card-id="preset">
      <div class="card-title"><span class="card-title-label"><span class="card-toggle"><i data-lucide="chevron-down"></i></span><i data-lucide="bookmark"></i><span data-i18n="preset-title">プリセット</span></span><button class="preset-item-del icon-btn--import" id="presetImportToggleBtn" data-i18n-title="import-code" title="コードをインポート" style="width:22px;height:22px;padding:0"><i data-lucide="log-in"></i></button><button class="preset-item-del icon-btn--copy" id="presetCopyAllBtn" data-i18n-title="copy-all-code" title="コードをコピー" style="width:22px;height:22px;padding:0"><i data-lucide="copy"></i></button><button class="preset-item-del icon-btn--dl" id="presetJsonExportBtn" data-i18n-title="export-json" title="JSONファイルで保存" style="width:22px;height:22px;padding:0"><i data-lucide="download"></i></button></div>
      <div class="preset-input-row" id="presetInputRow" style="display:none">
        <textarea class="url-input preset-code-textarea" id="presetCodeInput" data-i18n-ph="preset-code-ph" placeholder="取込コード（gf~…）または JSON を貼り付け" maxlength="65536" autocomplete="off" spellcheck="false" rows="4"></textarea>
        <button class="url-load-btn preset-code-load-btn" id="presetImportBtn" data-i18n="load-btn">読込</button>
      </div>
      <div class="preset-action-bar">
        <button class="preset-action-btn" id="presetAddFolderBtn" data-i18n-title="folder-add-title" title="フォルダを作成"><i data-lucide="folder-plus"></i><span data-i18n="folder-new">新しいフォルダ</span></button>
        <button class="preset-action-btn" id="presetAddBtn" data-i18n-title="preset-add-title" title="プリセットを作成"><i data-lucide="plus"></i><span data-i18n="preset-add-label">新しいプリセット</span></button>
      </div>
      <div class="preset-list" id="presetList" data-dnd-import></div>
      <div id="presetDndHint" style="display:none;font-size:11px;color:var(--text-muted);text-align:center;padding:6px 0;pointer-events:none" data-i18n="dnd-hint">JSONファイルをここにドロップ</div>
    </div>

  </div><!-- /パネル -->
</div><!-- /アプリ本体 -->

<script src="js/rain-engine.js"></script>
<script src="js/app.js"></script>
<div id="gf-toast-container"></div>
</body>
